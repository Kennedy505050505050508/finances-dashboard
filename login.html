<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#ffffff;
      color:#222;
    }
    .wrap{
      max-width:420px;
      margin:60px auto;
      padding:16px;
      border:1px solid #eee;
      border-radius:8px;
    }
    h1{
      margin:0 0 8px;
      font-size:22px;
      color:#ff7a00;
    }
    p{ margin:0 0 16px; color:#555; font-size:14px; }
    label{ display:block; margin-top:10px; font-size:14px; color:#333; }
    input{
      width:100%;
      padding:10px;
      margin-top:6px;
      border:1px solid #ddd;
      border-radius:6px;
      outline:none;
    }
    input:focus{ border-color:#ff7a00; }
    .btn{
      margin-top:16px;
      width:100%;
      padding:11px;
      border:none;
      border-radius:6px;
      background:#ff7a00;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
    .btn:hover{ background:#f36f00; }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      gap:10px;
    }
    .row a{
      font-size:13px;
      color:#ff7a00;
      text-decoration:none;
      font-weight:700;
    }
    .row a:hover{ text-decoration:underline; }
    .link{
      margin-top:12px;
      text-align:center;
      font-size:14px;
      color:#555;
    }
    .link a{ color:#ff7a00; text-decoration:none; font-weight:700; }
    .link a:hover{ text-decoration:underline; }
    .msg{
      margin-top:12px;
      padding:10px;
      border-radius:6px;
      display:none;
      font-size:14px;
    }
    .msg.ok{ background:#fff3e8; border:1px solid #ffd3b0; color:#7a3d00; }
    .msg.err{ background:#ffecec; border:1px solid #ffb3b3; color:#8a0000; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Login</h1>
    <p>Entre com seu e-mail e senha.</p>

    <form id="loginForm" action="#" method="post">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required />

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" minlength="6" required />

      <div class="row">
        <label style="display:flex; align-items:center; gap:8px; margin:0; font-size:13px; color:#333;">
          <input id="showPass" type="checkbox" />
          Mostrar senha
        </label>
        <a href="#" onclick="alert('Recuperação de senha (demo).'); return false;">Esqueceu?</a>
      </div>

      <button class="btn" type="submit">Entrar</button>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>

      <div class="link">
        Não tem conta?
        <a href="cadastro.html">Cadastre-se</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const showPass = document.getElementById('showPass');
    const password = document.getElementById('password');

    showPass.addEventListener('change', () => {
      password.type = showPass.checked ? 'text' : 'password';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const pass = password.value;

      msg.style.display = 'block';

      if (!email || pass.length < 6) {
        msg.className = 'msg err';
        msg.textContent = 'Informe um e-mail válido e uma senha com pelo menos 6 caracteres.';
        return;
      }

      // Demo (sem back-end)
      msg.className = 'msg ok';
      msg.textContent = 'Login realizado.';
      setTimeout(() => (window.location.href = 'pagina.html'), 900);
    });
  </script>
</body>
</html>
